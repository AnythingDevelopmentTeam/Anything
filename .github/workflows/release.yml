name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version tag (e.g. v2.1.0)
        required: false
        type: string

permissions:
  contents: write

jobs:
  prepare:
    name: Prepare Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - id: version
        shell: bash
        run: |
          VERSION="${{ inputs.version }}"
          [ -z "$VERSION" ] && VERSION="v$(date +'%Y.%m.%d')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          TAG=$(echo "$VERSION" | sed 's/[^a-zA-Z0-9._-]/-/g' | sed 's/--*/-/g' | sed 's/^[.-]//' | sed 's/[.-]$//')
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        shell: bash
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"

          cat > changelog.md <<EOF
          # Release ${VERSION}

          ## What's Changed

          ### Parent Repository
          $(git log --oneline --no-decorate -20 HEAD 2>/dev/null)

          EOF

          for sub in Anything-UI-WPF Anything-UI-GTK searchengine; do
            if [ -d "$sub" ]; then
              echo "" >> changelog.md
              echo "### $sub" >> changelog.md
              echo "" >> changelog.md
              (cd "$sub" && git log --oneline --no-decorate -20 HEAD 2>/dev/null) >> changelog.md
            fi
          done

      - uses: actions/upload-artifact@v7
        with:
          name: changelog
          path: changelog.md

  build-wpf:
    name: Build WPF
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions-rust-lang/setup-rust-toolchain@v1.17.0

      - name: Build searchengine.dll
        run: cargo build --release
        working-directory: searchengine

      - name: Copy searchengine.dll to WPF project
        run: copy searchengine\target\release\searchengine.dll Anything-UI-WPF\

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - run: dotnet publish -c Release -r win-x64 --self-contained true
        working-directory: Anything-UI-WPF

      - uses: actions/upload-artifact@v7
        with:
          name: wpf-build
          path: Anything-UI-WPF/bin/Release/net10.0-windows/win-x64/publish/

  build-gtk:
    name: Build GTK
    needs: prepare
    runs-on: ubuntu-latest
    container:
      image: fedora:latest
    steps:
      - name: Install git
        run: dnf install -y git

      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install dependencies
        run: dnf install -y gtk4-devel libadwaita-devel

      - uses: dtolnay/rust-toolchain@stable

      - run: cargo build --release
        working-directory: Anything-UI-GTK

      - uses: actions/upload-artifact@v7
        with:
          name: gtk-build
          path: Anything-UI-GTK/target/release/anything-gui

  release:
    name: Create Release
    needs: [prepare, build-wpf, build-gtk]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8

      - name: Create archives
        shell: bash
        run: |
          TAG="${{ needs.prepare.outputs.tag }}"
          mkdir -p archives
          (cd wpf-build && zip -r "../archives/anything-wpf-${TAG}.zip" .)
          (cd gtk-build && tar czf "../archives/anything-gtk-${TAG}.tar.gz" anything-gui)

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ needs.prepare.outputs.version }}
          body_path: changelog/changelog.md
          files: archives/*
